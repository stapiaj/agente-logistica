// ============================================================ ENGINE
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const out=p=>1-Math.pow(1-p,3);
const prog=(t,a,b)=>ease(clamp((t-a)/(b-a)));
const lerp=(a,b,p)=>a+(b-a)*p;
const win=(t,a,b,f=.25)=>clamp((t-a)/f)*clamp((b-t)/f);
const inW=(t,ws)=>ws.some(([a,b])=>t>=a&&t<=b);

function cam(t){
  for(let i=0;i<CAM.length-1;i++){const [t0,x0,y0,s0]=CAM[i],[t1,x1,y1,s1]=CAM[i+1];
    if(t>=t0&&t<=t1){const p=ease((t-t0)/(t1-t0));
      return {x:lerp(x0,x1,p),y:lerp(y0,y1,p),s:Math.exp(lerp(Math.log(s0),Math.log(s1),p))};}}
  const l=CAM[CAM.length-1]; return {x:l[1],y:l[2],s:l[3]};
}
function bez(A,B,p){ // same curve as the edges between modules
  const P0=[A[0],A[1]],P1=[A[0]+150,A[1]],P2=[B[0]-150,B[1]],P3=[B[0],B[1]],q=1-p;
  return [q*q*q*P0[0]+3*q*q*p*P1[0]+3*q*p*p*P2[0]+p*p*p*P3[0], q*q*q*P0[1]+3*q*q*p*P1[1]+3*q*p*p*P2[1]+p*p*p*P3[1]];
}
// packet segments: [t0,t1,x0,y0,x1,y1] (straight) or [t0,t1,'bez',A,B]
function along(t,segs){
  for(const s of segs){ if(t>=s[0]&&t<=s[1]){const p=prog(t,s[0],s[1]);
    if(s[2]==='bez') return bez(s[3],s[4],p);
    return [lerp(s[2],s[4],p),lerp(s[3],s[5],p)];}}
  return null;
}
function packets(t){
  const P=[];
  // main message ENV-1002
  if(t>=11.0&&t<37.6){
    const pos=along(t,[[11.0,12.6,615,430,615,430],[12.6,15.0,615,430,740,430],[15.0,17.8,740,430,740,430],[17.8,18.8,740,430,1070,430],
      [18.8,33.6,1070,430,1070,430],[33.6,35.4,1070,430,1370,430],[35.4,37.0,1370,430,1370,430],[37.0,37.6,1370,430,1460,430]]);
    P.push({x:pos[0],y:pos[1],kind:'mail',key:1,op:clamp((t-11)/.35),pop:out(clamp((t-11)/.4)),stamp:out(clamp((t-28.0)/.3)),glow:win(t,16.3,17.1,.2)});
  }
  if(t>=19.6&&t<=22.8){ // impostor (no secret)
    let x,y=430,op=1;
    if(t<20.4) x=lerp(560,740,prog(t,19.6,20.4));
    else if(t<22.0){x=740; if(t>21.3&&t<21.7) x+=Math.sin((t-21.3)*60)*6;}
    else {const p=prog(t,22.0,22.8); x=lerp(740,600,p); y=430-Math.sin(p*Math.PI)*40; op=1-p;}
    P.push({x,y,kind:'bad',op});
  }
  if(t>=30.0&&t<=33.4){ // duplicate delivery
    const x=lerp(960,1040,prog(t,30.0,30.8)); P.push({x,y:478,kind:'mail',key:1,op:clamp((t-30)/.3)*(1-prog(t,32.6,33.4)),stamp:1,dup:1});
  }
  const G=[1550,430];
  const outs=[[63.2,64.6,'cartero','mail'],[64.0,65.4,'heraldo','alert'],[64.8,66.2,'cronista','note'],[86.0,87.6,'heraldo','draft']];
  for(const [a,b,m,kind] of outs){ if(t>=a&&t<=b+.3){
    const B=[N[m].x-90,N[m].y]; let pos;
    if(t<=b) pos=bez(G,B,prog(t,a,b)); else pos=[lerp(B[0],N[m].x,prog(t,b,b+.3)),B[1]];
    P.push({x:pos[0],y:pos[1],kind,op:1,key:kind==='mail'});
  }}
  if(t>=76.4&&t<=80.8){ const x=t<=80.4?lerp(310,1370,prog(t,76.4,80.4)):lerp(1370,1460,prog(t,80.4,80.8)); P.push({x,y:430,kind:'case2',op:1}); }
  for(const [a,b] of [[52.6,53.4],[81.3,81.9]]) if(t>=a&&t<=b){P.push({x:1460,y:lerp(522,678,prog(t,a,b)),kind:'pulse',op:1});}
  return P;
}
function pktSVG(e){
  const sc=e.pop!==undefined?.6+.4*e.pop:1;
  let s=`<g transform="translate(${e.x},${e.y}) scale(${sc})" opacity="${e.op}">`;
  const env=(fill)=>`<rect x="-24" y="-16" width="48" height="32" rx="6" fill="${fill}"/><path d="M-22,-13 L0,3 L22,-13" fill="none" stroke="#0A0D14" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" opacity=".5"/>`;
  switch(e.kind){
    case 'mail': s+=env(AMBER);
      if(e.key){ s+=`<circle cx="18" cy="10" r="${11+(e.glow||0)*6}" fill="#FFF7E6" opacity="${.22+(e.glow||0)*.6}"/>
        <g transform="translate(18,10)"><circle r="4.6" fill="none" stroke="#0A0D14" stroke-width="2.3"/><path d="M4.6,0 H11 M9,0 V3.6" stroke="#0A0D14" stroke-width="2.3" stroke-linecap="round"/></g>`;}
      if(e.stamp) s+=`<g transform="translate(-18,-14) scale(${e.stamp})"><circle r="9" fill="#F472B6"/><path d="M-4,0 L-1,3 L4,-3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
      break;
    case 'bad': s+=env('#E5484D')+`<text x="17" y="15" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">?</text>`; break;
    case 'alert': s+=`<rect x="-22" y="-16" width="44" height="32" rx="9" fill="#38BDF8"/><path d="M-9,1 L9,-7 L3,8 L0,2 Z" fill="#0A0D14" opacity=".75"/>`; break;
    case 'note': s+=`<rect x="-18" y="-22" width="36" height="44" rx="6" fill="#A3E635"/><path d="M-10,-10 H10 M-10,-2 H10 M-10,6 H4" stroke="#0A0D14" stroke-width="2.4" stroke-linecap="round" opacity=".6"/>`; break;
    case 'draft': s+=`<rect x="-18" y="-22" width="36" height="44" rx="6" fill="#F4F6FA"/><path d="M-10,-10 H10 M-10,-2 H10 M-10,6 H4" stroke="#0A0D14" stroke-width="2.4" stroke-linecap="round" opacity=".45"/><rect x="-21" y="12" width="42" height="13" rx="4" fill="${AMBER}"/>`; break;
    case 'case2': s+=env(AMBER)+`<circle cx="18" cy="-13" r="9" fill="#E5484D"/><text x="18" y="-8" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">!</text>`; break;
    case 'pulse': s+=`<circle r="9" fill="${AMBER}"/><circle r="16" fill="${AMBER}" opacity=".25"/>`; break;
  }
  return s+'</g>';
}

    gestor:`<path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" ${st}/>`,
    inspectora:`<rect x="-7" y="-7" width="14" height="14" rx="3" ${st}/><path d="M-3,0 L-1,3 L4,-3" ${st}/>`,
    cartero:`<rect x="-8" y="-5.5" width="16" height="11" rx="2" ${st}/><path d="M-7,-4 L0,1 L7,-4" ${st}/>`,

    cronista:`<path d="M-6,7 L-5,3 L4,-6 L7,-3 L-2,6 Z" ${st}/>`,
  })[id];
}

function talking(id,t){ return BUBBLES.some(([m,a,b])=>m===id&&t>=a&&t<=Math.min(b,a+Math.max(.6,(b-a)*.6))); }

function glyph(id,n,t,look,o={}){
  const bob=Math.sin(t*2.1+n.x*.013)*2;
  const blink=((t+n.x*.0071)%4.1)<0.12?0.12:1;
  let px=0,py=0;
  if(look){const dx=look[0]-n.x-(o.dx||0), dy=look[1]-(n.y-4); const L=Math.hypot(dx,dy)||1; const k=clamp(L/60); px=dx/L*5.5*k; py=dy/L*4.5*k;}
  const col=o.col||n.c;
  let face='';
  const tk=talking(id,t)&&!o.silent;
  if(tk){const op=Math.abs(Math.sin(t*15)); face+=`<ellipse cx="0" cy="25" rx="8" ry="${2.5+op*6}" fill="#0A0D14"/>`;}
  if(id==='portero'){
    const angry=win(t,21.3,23.4,.2)*14;
    if(angry>1) face+=`<path d="M-27,${-22-angry*.3} L-9,${-22+angry*.5}" stroke="#0A0D14" stroke-width="4.5" stroke-linecap="round"/><path d="M27,${-22-angry*.3} L9,${-22+angry*.5}" stroke="#0A0D14" stroke-width="4.5" stroke-linecap="round"/>`;
    face+=`<path d="M-40,-32 Q0,-68 40,-32 Z" fill="#162033"/><rect x="-46" y="-36" width="92" height="9" rx="4.5" fill="#0D1420"/><circle cx="0" cy="-47" r="5" fill="${AMBER}"/>`;
  }
  if(id==='inspectora') face+=`<circle cx="-17" cy="-4" r="16" fill="none" stroke="#0A0D14" stroke-width="3.2"/><circle cx="17" cy="-4" r="16" fill="none" stroke="#0A0D14" stroke-width="3.2"/><path d="M-1,-4 H1" stroke="#0A0D14" stroke-width="3.2"/>`;
  if(o.sweat) face+=`<path d="M38,-30 Q44,-20 38,-14 Q32,-20 38,-30 Z" fill="#BFE9F5" opacity="${o.sweat}"/>`;
  let eyes;
  if(o.worried) eyes=`<path d="M-28,2 Q-18,-8 -8,2 M8,2 Q18,-8 28,2" fill="none" stroke="#0A0D14" stroke-width="4.5" stroke-linecap="round"/>`;
  else eyes=`<g transform="translate(0,-4) scale(1,${blink})"><ellipse cx="-17" cy="0" rx="12" ry="14" fill="#fff"/><ellipse cx="17" cy="0" rx="12" ry="14" fill="#fff"/>
      <circle cx="${-17+px}" cy="${1+py}" r="6.5" fill="#0A0D14"/><circle cx="${17+px}" cy="${1+py}" r="6.5" fill="#0A0D14"/></g>`;
  return `<g transform="translate(${o.dx||0},${bob+6})" opacity="${o.op===undefined?1:o.op}"><rect x="-50" y="-46" width="100" height="96" rx="40" fill="${col}"/>${eyes}${face}</g>`;
}

function focusOp(id,t){let o=1; for(const [a,b,ids] of FOCUS){ if(!ids.includes(id)) o=Math.min(o,1-.72*win(t,a,b,.6)); } return o;}
function card(id,n,t,look){
  let inner;
  if(id==='gestor'){
    const sw=prog(t,45.2,46.0)*(1-prog(t,49.0,49.8)); // hand-over to the fallback model
    const sweat=win(t,43.4,45.4,.2);
    inner=glyph(id,n,t,look,{dx:-130*sw,op:1-sw,worried:sweat>.5,sweat,silent:sw>.3})+
      (sw>0?glyph(id,n,t,look,{dx:130*(1-sw),op:sw,col:'#7DD3FC',silent:sw<.3}):'');
  } else inner=glyph(id,n,t,look);
  return `<g transform="translate(${n.x},${n.y})" opacity="${focusOp(id,t)}">
    <clipPath id="cl-${id}"><rect x="-90" y="-90" width="180" height="180" rx="38"/></clipPath>
    <rect x="-90" y="-90" width="180" height="180" rx="38" fill="#10151F" stroke="${n.c}" stroke-opacity=".45" stroke-width="2"/>
    <g clip-path="url(#cl-${id})">${inner}</g>
    <g transform="translate(64,-64)">${icon(id)}</g>
    <text y="126" text-anchor="middle" fill="#EEF1F6" font-size="23" font-weight="700">${n.name}</text>
    <text y="153" text-anchor="middle" fill="#6F7A8E" font-size="16" font-family="JetBrains Mono, DejaVu Sans Mono, Consolas, monospace">${n.tech}</text>
  </g>`;
}

function sheetPanel(t){ // the sheet with its rows (chapter 1)
  const o=win(t,6.0,13.6,.5); if(o<=0) return '';
  const flip=prog(t,7.4,7.8);
  const rows=[['ENV-1001','en_transito','6'],['ENV-1002',null,'30'],['ENV-1003','en_transito','4']];
  let s=`<g opacity="${o}" font-family="JetBrains Mono, DejaVu Sans Mono, Consolas, monospace" font-size="13">
    <rect x="125" y="600" width="350" height="104" rx="12" fill="#121826" stroke="#2A3550" stroke-width="1.5"/>
    <text x="142" y="624" fill="#6F7A8E">shipment_id</text><text x="262" y="624" fill="#6F7A8E">status</text><text x="400" y="624" fill="#6F7A8E">delay_h</text>`;
  rows.forEach((r,i)=>{const y=650+i*22;
    if(r[1]===null){
      s+=`<rect x="252" y="${y-15}" width="118" height="20" rx="5" fill="${AMBER}" opacity="${flip*.22}"/>`;
      s+=`<text x="262" y="${y}" fill="#C8D0DC" opacity="${1-flip}">en_transito</text><text x="262" y="${y}" fill="${AMBER}" font-weight="700" opacity="${flip}">retrasado</text>`;
    } else s+=`<text x="262" y="${y}" fill="#C8D0DC">${r[1]}</text>`;
    s+=`<text x="142" y="${y}" fill="#EEF1F6">${r[0]}</text><text x="400" y="${y}" fill="#C8D0DC">${r[2]}</text>`;});
  return s+'</g>';
}

function render(t){
  const c=cam(t), P=packets(t);
  const S=(wx,wy)=>[(wx-c.x)*c.s+960,(wy-c.y)*c.s+540];
  const mapOp=1-prog(t,91.5,92.5)*.85;
  let w=`<defs><pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1.4" fill="#182032"/></pattern></defs>
    <rect x="-3000" y="-3000" width="8000" height="7000" fill="url(#dots)"/><g opacity="${mapOp}">`;
  for(const [x,y,wd,h,l] of ZONES) w+=`<rect x="${x}" y="${y}" width="${wd}" height="${h}" rx="32" fill="#0D121C" stroke="#222B3E" stroke-dasharray="8 10" stroke-width="1.6"/>
     <text x="${x+26}" y="${y+38}" fill="#4F5B73" font-size="17" font-weight="700" letter-spacing="2.5">${l}</text>`;
  const outro=t>91.5&&t<99;
  for(const k in EDGES){const [a,b,ws]=EDGES[k],A=N[a],B=N[b];
    const on=inW(t,ws)||outro;
    const d=(A.y===B.y||A.x===B.x)?`M${A.x},${A.y} L${B.x},${B.y}`:`M${A.x},${A.y} C${A.x+150},${A.y} ${B.x-150},${B.y} ${B.x},${B.y}`;
    w+=`<path d="${d}" fill="none" stroke="#263049" stroke-width="2.5"/>`;
    if(on) w+=`<path d="${d}" fill="none" stroke="${AMBER}" stroke-width="3.5" stroke-dasharray="10 12" stroke-dashoffset="${-t*44}" opacity=".9"/>`;
  }
  w+=`<text x="690" y="414" text-anchor="middle" fill="#6F7A8E" font-size="14" font-family="JetBrains Mono, DejaVu Sans Mono, Consolas, monospace">webhook</text>`;
  w+=sheetPanel(t);
  for(const p of P) w+=pktSVG(p);
  for(const id in N){
    const n=N[id]; let look=null,best=1e9;
    for(const p of P){const d=Math.hypot(p.x-n.x,p.y-n.y); if(d<520&&d<best){best=d;look=[p.x,p.y];}}
    if(id==='hoja'&&t>6&&t<9.5) look=[300,660];
    if(id==='vigia'&&t>7&&t<9.8) look=[300,660];
    if(id==='gestor'&&t>50.5&&t<62) look=[1460,770];
    if(id==='inspectora'&&t>50.5&&t<62) look=[1460,430];
    if(id==='inspectora'&&t>81.5&&t<86.5) look=[1460,430];
    if(id==='gestor'&&t>81.5&&t<86) look=[1460,770];
    w+=card(id,n,t,look);
  }
  // FastAPI gate
  const op=prog(t,17.3,17.7)*(1-prog(t,19.0,19.3));
  w+=`<g transform="translate(0,${-op*70})" opacity="${1-op*.85}"><rect x="765" y="394" width="10" height="72" rx="5" fill="#4C8DFF"/></g>`;
  const ok=win(t,17.0,18.2,.15), ko=win(t,21.3,22.4,.15);
  if(ok>0) w+=`<g transform="translate(740,388) scale(${.6+ok*.4})" opacity="${ok}"><circle r="14" fill="#2EBD85"/><path d="M-6,0 L-2,5 L7,-5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  if(ko>0) w+=`<g transform="translate(740,388) scale(${.6+ko*.4})" opacity="${ko}"><circle r="14" fill="#E5484D"/><path d="M-5,-5 L5,5 M5,-5 L-5,5" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/></g>`;
  const lock=win(t,58.6,61.4,.2);
  if(lock>0) w+=`<g transform="translate(1540,690) scale(${.7+.3*lock})" opacity="${lock}"><circle r="22" fill="#E5484D"/><rect x="-9" y="-3" width="18" height="13" rx="3" fill="#fff"/><path d="M-5.5,-3 V-7 A5.5,5.5 0 0 1 5.5,-7 V-3" fill="none" stroke="#fff" stroke-width="3"/></g>`;
  w+='</g>';
  document.getElementById('svg').innerHTML=`<rect width="1920" height="1080" fill="#0A0D14"/><g transform="translate(960,540) scale(${c.s}) translate(${-c.x},${-c.y})">${w}</g>`;

  // ---------- text layer (fixed screen size)
  let h='';
  const ti=1-prog(t,3.6,4.3);
  if(ti>0) h+=`<div id="title" style="opacity:${ti}"><h1>El viaje de un <b>retraso</b></h1><p>Un aviso recorre el Agente Logística, módulo a módulo</p></div>`;
  for(const [a,b,num,name,tech] of CHAPTERS){const o=win(t,a,b,.4); if(o>0) h+=`<div id="kicker" style="opacity:${o}"><b>${num}</b>${name}<span>${tech}</span></div>`;}
  for(const [m,a,b,html,pos] of BUBBLES){const o=win(t,a,b,.18); if(o<=0) continue; const n=N[m];
    const sc=.9+.1*out(clamp((t-a)/.25));
    if(pos==='top'){const [x,y]=S(n.x-30,n.y-96); h+=`<div class="bubble" style="left:${x}px;top:${y}px;opacity:${o};transform:translate(0,-100%) scale(${sc});transform-origin:0 100%">${html}</div>`;}
    else {const [x,y]=S(n.x+96,n.y); h+=`<div class="bubble" style="left:${x+14}px;top:${y}px;opacity:${o};transform:translate(0,-50%) scale(${sc});transform-origin:0 50%">${html}</div>`;}
  }
  for(const [m,a,b,ttl,lines] of PANELS){const o=win(t,a,b,.25); if(o<=0) continue; const n=N[m]; const [x,y]=S(n.x+96,n.y);
    let ls=''; for(const [la,txt,dim] of lines){const lo=clamp((t-la)/.3); ls+=`<div class="ln${dim?' dim':''}" style="opacity:${lo};transform:translateY(${(1-lo)*8}px)">${txt}</div>`;}
    h+=`<div class="panel" style="left:${x+16}px;top:${y}px;opacity:${o};transform:translate(0,-50%)"><h6>${ttl}</h6>${ls}</div>`;}
  for(const [m,a,b,html,mono] of CHIPS){const o=win(t,a,b,.25); if(o<=0) continue; const n=N[m]; const [x,y]=S(n.x+100,n.y);
    h+=`<div class="chip${mono?' mono':''}" style="left:${x+14}px;top:${y}px;opacity:${o};transform:translate(0,-50%) scale(${.92+.08*o})">${html}</div>`;}
  const c2=win(t,75.2,80.8,.3);
  if(c2>0) h+=`<div class="chip" style="left:960px;top:150px;opacity:${c2};transform:translate(-50%,0);font-size:28px;padding:14px 26px;border-color:#E5484D">ENV-1006 · camión robado · <span style="color:#F5A623">6 h de retraso</span></div>`;
  h+=`<div id="shade"></div>`;
  for(const [a,b,txt] of CAPTIONS){const o=win(t,a,b,.3); if(o>0) h+=`<div id="cap" style="opacity:${o};transform:translateY(${(1-o)*6}px)">${txt}</div>`;}
  const oo=win(t,92.3,DURATION+1,.6);
  if(oo>0) h+=`<div id="outro" style="opacity:${oo}"><h2>El prompt orienta.<br><b>El código garantiza.</b></h2><p>github.com/stapiaj/agente-logistica</p></div>`;
  document.getElementById('ov').innerHTML=h;
  document.getElementById('bar').style.width=(RENDER?0:t/DURATION*1920)+'px';
}

// ============================================================ PLAYER
const RENDER = new URLSearchParams(location.search).has('render');
window.render=render;
function fit(){const f=document.getElementById('frame'); if(RENDER){f.style.transform='none';return;}
  const k=Math.min(innerWidth/1920,innerHeight/1080); f.style.transform=`translate(${(innerWidth-1920*k)/2}px,${(innerHeight-1080*k)/2}px) scale(${k})`;}
addEventListener('resize',fit); fit();
if(!RENDER){
  let t0=performance.now(), paused=false, at=0;
  addEventListener('keydown',e=>{ if(e.code==='Space'){paused=!paused; if(!paused) t0=performance.now()-at*1000;}
    if(e.code==='ArrowRight'){at=Math.min(DURATION,at+5); t0=performance.now()-at*1000;}
    if(e.code==='ArrowLeft'){at=Math.max(0,at-5); t0=performance.now()-at*1000;} });
  addEventListener('click',()=>{at=0;t0=performance.now();paused=false;});
  (function loop(now){ if(!paused){at=((now-t0)/1000)%DURATION;} render(at); requestAnimationFrame(loop); })(performance.now());
} else render(0);
</script>
</body></html>
